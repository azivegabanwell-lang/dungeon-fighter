<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brawlers</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a0a12; color: #fff;
    font-family: 'Courier New', monospace;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  #wrap { position: relative; }
  canvas {
    display: block;
    background: #1a1f2e;
    border: 3px solid #333;
    box-shadow: 0 0 40px rgba(0,0,0,0.7);
    image-rendering: pixelated;
  }
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    background: rgba(8,10,18,0.86);
    gap: 14px;
  }
  .overlay.hidden { display: none; }
  .overlay h1 { font-size: 48px; margin: 0; letter-spacing: 4px; text-shadow: 0 0 18px #4af; }
  .overlay h2 { font-size: 26px; margin: 6px 0; }
  .overlay p  { margin: 4px 0; color: #aab; font-size: 14px; line-height: 1.5; }
  .btn {
    font-family: inherit; font-size: 18px; font-weight: bold;
    padding: 10px 26px; margin: 4px;
    background: #2b3147; color: #fff;
    border: 2px solid #55607f; border-radius: 8px;
    cursor: pointer; transition: all 0.12s;
  }
  .btn:hover { background: #3d4768; border-color: #88a; transform: translateY(-2px); }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; max-width: 840px; }
  .charBtn {
    width: 94px; padding: 6px 4px;
    background: #20263a; border: 2px solid #444f70; border-radius: 8px;
    cursor: pointer; transition: all 0.12s;
  }
  .charBtn:hover { transform: translateY(-2px); border-color: #fff; }
  .charBtn .nm { font-size: 13px; font-weight: bold; }
  .charBtn .st { font-size: 9px; color: #9aa; margin-top: 2px; min-height: 34px; line-height: 1.25; }
  .charBtn .sp { font-size: 9px; margin-top: 3px; color: #ffd76b; }
  .swatch { width: 18px; height: 18px; border-radius: 50%; margin: 3px auto; }
  .small { font-size: 12px; color: #889; }

  /* ---- MOBILE TOUCH CONTROLS ---- */
  #mobileControls {
    display: none;
    position: fixed;          /* anchored to viewport, not to #wrap */
    left: 0; right: 0; bottom: 0;
    height: 160px;
    pointer-events: none;
    z-index: 100;
    user-select: none;
  }
  #mobileControls.show { display: block; }

  /* D-pad cluster bottom-left */
  #dpad {
    position: absolute;
    left: 14px; bottom: 14px;
    width: 150px; height: 150px;
    pointer-events: none;
  }
  .dpad-btn {
    position: absolute;
    width: 50px; height: 50px;
    background: rgba(255,255,255,0.12);
    border: 2px solid rgba(255,255,255,0.28);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    color: rgba(255,255,255,0.75);
    pointer-events: all;
    touch-action: none;
    cursor: pointer;
    transition: background 0.08s;
    -webkit-tap-highlight-color: transparent;
  }
  .dpad-btn.active { background: rgba(255,255,255,0.32); }
  #dLeft  { left: 0;   top: 50px; }
  #dRight { left: 100px; top: 50px; }
  #dUp    { left: 50px; top: 0; }
  #dDown  { left: 50px; top: 100px; }

  /* Action buttons bottom-right */
  #actionBtns {
    position: absolute;
    right: 14px; bottom: 14px;
    width: 200px; height: 150px;
    pointer-events: none;
  }
  .act-btn {
    position: absolute;
    width: 54px; height: 54px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: bold; letter-spacing: 0.5px;
    color: #fff;
    border: 2px solid rgba(255,255,255,0.3);
    pointer-events: all;
    touch-action: none;
    cursor: pointer;
    transition: filter 0.08s;
    -webkit-tap-highlight-color: transparent;
    text-align: center; line-height: 1.1;
  }
  .act-btn.active { filter: brightness(1.5); }
  #abBlock   { background: rgba(80,120,220,0.5);  right: 140px; bottom: 80px; }
  #abPunch   { background: rgba(255,100,60,0.55); right: 76px;  bottom: 90px; }
  #abKick    { background: rgba(60,200,100,0.55); right: 10px;  bottom: 80px; }
  #abSpecial { background: rgba(220,180,0,0.55);  right: 70px;  bottom: 24px; width: 66px; height: 66px; font-size: 10px; }
</style>
</head>
<body>
<!-- MOBILE CONTROLS — fixed to viewport, outside #wrap so canvas scaling doesn't affect it -->
<div id="mobileControls">
  <div id="dpad">
    <div class="dpad-btn" id="dLeft">&#9664;</div>
    <div class="dpad-btn" id="dRight">&#9654;</div>
    <div class="dpad-btn" id="dUp">&#9650;</div>
    <div class="dpad-btn" id="dDown">&#9660;</div>
  </div>
  <div id="actionBtns">
    <div class="act-btn" id="abBlock">BLOCK</div>
    <div class="act-btn" id="abPunch">PUNCH</div>
    <div class="act-btn" id="abKick">KICK</div>
    <div class="act-btn" id="abSpecial">SPECIAL</div>
  </div>
</div>

<div id="wrap">
  <canvas id="game" width="900" height="540"></canvas>

  <!-- TITLE -->
  <div class="overlay" id="titleScreen">
    <h1>BRAWLERS</h1>
    <p>15 fighters &middot; unique specials &middot; 1v1, 2v2 &amp; online 2-4P</p>
    <div class="row">
      <button class="btn" id="btn1v1">1 v 1</button>
      <button class="btn" id="btn2v2">2 v 2</button>
      <button class="btn" id="btnOnline">Online</button>
      <button class="btn" id="btnAccount">Account</button>
    </div>
    <p class="small">Move: A / D &nbsp; Jump: W &nbsp; Block: S &nbsp; Punch: J &nbsp; Kick: K &nbsp; Special: L</p>
    <div style="margin-top:18px">
      <a href="index.html" style="display:inline-block;padding:8px 22px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#aaa;font-size:0.8rem;text-decoration:none;letter-spacing:1px;transition:all 0.2s" onmouseover="this.style.background='rgba(255,255,255,0.15)';this.style.color='#fff'" onmouseout="this.style.background='rgba(255,255,255,0.08)';this.style.color='#aaa'">&#8592; Back to Games</a>
    </div>
  </div>

  <!-- CHARACTER SELECT -->
  <div class="overlay hidden" id="selectScreen">
    <h2 id="selTitle">CHOOSE YOUR FIGHTER</h2>
    <div class="row" id="charRow"></div>
    <div id="styleRow"></div>
    <button class="btn" id="btnBack">&larr; Back</button>
  </div>

  <!-- OPPONENT SELECT -->
  <div class="overlay hidden" id="oppScreen">
    <h2 id="oppTitle">CHOOSE YOUR OPPONENT</h2>
    <div class="row" id="oppRow"></div>
    <button class="btn" id="btnOppBack">&larr; Back</button>
  </div>

  <!-- PAUSE -->
  <div class="overlay hidden" id="pauseScreen">
    <h1>PAUSED</h1>
    <div class="row">
      <button class="btn" id="btnResume">Resume</button>
      <button class="btn" id="btnQuit">Main Menu</button>
    </div>
    <p class="small">Press P or Esc to resume</p>
  </div>

  <!-- ONLINE 2P LOBBY (content filled in by renderOnlineUI) -->
  <div class="overlay hidden" id="onlineScreen"></div>

  <!-- ACCOUNTS (content filled in by renderAccount) -->
  <div class="overlay hidden" id="accountScreen"></div>

  <!-- MATCH OVER -->
  <div class="overlay hidden" id="matchScreen">
    <h1 id="matchText">YOU WIN!</h1>
    <p id="matchSub"></p>
    <div class="row">
      <button class="btn" id="btnAgain">Play Again</button>
      <button class="btn" id="btnMenu">Main Menu</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// =====================================================================
// STICK BRAWLERS — a single-file 2D fighting game
// Modes: 1v1 vs CPU, and 2v2 (you + AI ally vs 2 AI). Stickman fighters,
// 5 characters each with a unique special. Meter fills as you fight.
// =====================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = 900, H = 540;

// ---- world constants ----
const GROUND_Y = 470;      // the floor line; a fighter's y is its FEET
const GRAV = 2200;         // px/s^2
const JUMP_V = -780;       // base jump velocity (per-char multiplier applied)
const MAX_FALL = 1400;
const WALL_L = 40, WALL_R = W - 40;
const ROUND_TIME = 60;     // seconds per round
const ROUNDS_TO_WIN = 3;   // first to 3 round wins takes the match
const MAX_HP = 100;
const MAX_METER = 100;
const HITSTOP = 0.05;      // brief global freeze on a clean hit (juice)
const DEBUG = false;       // set true to draw hitboxes

// =====================================================================
// INPUT
// =====================================================================
const keys = {};
const justPressed = new Set();   // edge-triggered (so holding a key doesn't auto-repeat attacks)
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) justPressed.add(e.code);
  keys[e.code] = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function clearJustPressed() { justPressed.clear(); }

// =====================================================================
// MOBILE TOUCH CONTROLS
// =====================================================================
(function() {
  // Show controls on touch devices or narrow screens
  const mc = document.getElementById('mobileControls');
  const gameCanvas = document.getElementById('game');

  // Scale canvas CSS size to fit the viewport (internal resolution stays 900x540)
  function scaleGame() {
    const isMobile = mc.classList.contains('show');
    const ctrlH = isMobile ? 164 : 0;   // leave gap for touch controls
    const availW = window.innerWidth;
    const availH = window.innerHeight - ctrlH;
    const scale = Math.min(availW / 900, availH / 540, 1); // never scale up on desktop
    gameCanvas.style.width  = Math.round(900 * scale) + 'px';
    gameCanvas.style.height = Math.round(540 * scale) + 'px';
  }

  function checkTouch() {
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0 || window.innerWidth <= 960) {
      mc.classList.add('show');
    }
    scaleGame(); // re-scale whenever touch state or viewport changes
  }
  checkTouch();
  window.addEventListener('resize', checkTouch);

  // Map button id → key code (and whether it's a justPressed one-shot)
  const BTN_MAP = {
    dLeft:    { code: 'KeyA',  oneShot: false },
    dRight:   { code: 'KeyD',  oneShot: false },
    dUp:      { code: 'KeyW',  oneShot: true  },
    dDown:    { code: 'KeyS',  oneShot: false },
    abBlock:  { code: 'KeyS',  oneShot: false },
    abPunch:  { code: 'KeyJ',  oneShot: true  },
    abKick:   { code: 'KeyK',  oneShot: true  },
    abSpecial:{ code: 'KeyL',  oneShot: true  },
  };

  // Track which touch IDs are holding which buttons
  const touchHeld = {}; // touchId → btnId

  function pressBtn(id) {
    const m = BTN_MAP[id];
    if (!m) return;
    const el = document.getElementById(id);
    if (el) el.classList.add('active');
    keys[m.code] = true;
    if (m.oneShot) justPressed.add(m.code);
  }
  function releaseBtn(id) {
    const m = BTN_MAP[id];
    if (!m) return;
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
    // Only clear key if no other touch is holding the same button
    const stillHeld = Object.values(touchHeld).some(b => b === id);
    if (!stillHeld) keys[m.code] = false;
  }

  function btnFromTarget(target) {
    // Walk up to find the .dpad-btn or .act-btn
    let el = target;
    while (el && el !== mc) {
      if (el.id && BTN_MAP[el.id]) return el.id;
      el = el.parentElement;
    }
    return null;
  }

  mc.addEventListener('touchstart', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const id = btnFromTarget(document.elementFromPoint(t.clientX, t.clientY));
      if (id) { touchHeld[t.identifier] = id; pressBtn(id); }
    }
  }, { passive: false });

  mc.addEventListener('touchend', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const id = touchHeld[t.identifier];
      if (id) { delete touchHeld[t.identifier]; releaseBtn(id); }
    }
  }, { passive: false });

  mc.addEventListener('touchcancel', e => {
    for (const t of e.changedTouches) {
      const id = touchHeld[t.identifier];
      if (id) { delete touchHeld[t.identifier]; releaseBtn(id); }
    }
  });

  // Slide your thumb from one button to another
  mc.addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      const newId = btnFromTarget(document.elementFromPoint(t.clientX, t.clientY));
      const oldId = touchHeld[t.identifier];
      if (newId !== oldId) {
        if (oldId) { delete touchHeld[t.identifier]; releaseBtn(oldId); }
        if (newId) { touchHeld[t.identifier] = newId; pressBtn(newId); }
      }
    }
  }, { passive: false });
})();

// Mouse (for the on-screen pause button)
const mouse = { x: 0, y: 0 };
let mouseClicked = false;
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener('mousedown', () => { mouseClicked = true; });
const PAUSE_BTN = { x: W / 2 - 17, y: 6, w: 34, h: 22 };
function inPauseBtn() {
  return mouse.x >= PAUSE_BTN.x && mouse.x <= PAUSE_BTN.x + PAUSE_BTN.w &&
         mouse.y >= PAUSE_BTN.y && mouse.y <= PAUSE_BTN.y + PAUSE_BTN.h;
}

// =====================================================================

    walkSpeed: 220, jumpMul: 1.15, maxHp: 100, punchDmg: 6, punchRange: 36, kickDmg: 10, kickRange: 48,
    special: 'freeze', specialName: 'STASIS', bodyScale: 0.78, crystalline: true,
    customKick: { name: 'FROST KICK', cooldown: 4, effect: 'frostkick' } },
  { name: 'Echo', color: '#f1c40f', style: 'Lancer. Hurls a piercing javelin from afar.',
    walkSpeed: 210, jumpMul: 0.95, maxHp: 100, punchDmg: 6, punchRange: 46, kickDmg: 12, kickRange: 60,
    special: 'javelin', specialName: 'JAVELIN', bodyScale: 1.07, lightningMark: true },
  { name: 'Mirror', color: '#c9d2e0', style: 'Counter. Parries the next hit, then punishes hard.',
    walkSpeed: 205, jumpMul: 1.0,  maxHp: 100, punchDmg: 6, punchRange: 38, kickDmg: 11, kickRange: 50,
    special: 'counter', specialName: 'RIPOSTE', metallic: true },
  { name: 'Sage', color: '#23c7a7', style: 'Survivor. Meditates to heal — but is defenseless.',
    walkSpeed: 195, jumpMul: 0.95, maxHp: 95,  punchDmg: 6, punchRange: 38, kickDmg: 10, kickRange: 48,
    special: 'heal', specialName: 'MEDITATE', sagely: true },
  { name: 'Crush', color: '#e2792a', style: 'Grappler. Unblockable grab that ignores guard.',
    walkSpeed: 165, jumpMul: 0.85, maxHp: 115, punchDmg: 7, punchRange: 38, kickDmg: 13, kickRange: 48,
    special: 'grab', specialName: 'SEISMIC GRAB', bodyScale: 1.22, muscles: true, rocky: true },
  { name: 'Phantom', color: '#6a5cff', style: 'Trickster. Blinks behind the foe for a backstab.',
    walkSpeed: 235, jumpMul: 1.1,  maxHp: 92,  punchDmg: 6, punchRange: 36, kickDmg: 10, kickRange: 46,
    special: 'teleport', specialName: 'SHADOW STEP', bodyScale: 0.85, ghostly: true, spectral: true },
  { name: 'Rune', color: '#ff4fcf', style: 'Trapper. Lays a rune that detonates on contact.',
    walkSpeed: 210, jumpMul: 1.0,  maxHp: 98,  punchDmg: 6, punchRange: 40, kickDmg: 11, kickRange: 50,
    special: 'trap', specialName: 'RUNE TRAP', runic: true },
  { name: 'Bastion', color: '#4d80b0', style: 'Defender. Raises a shield of total invulnerability.',
    walkSpeed: 175, jumpMul: 0.9,  maxHp: 115, punchDmg: 7, punchRange: 38, kickDmg: 13, kickRange: 50,

  { name: 'Gale', color: '#8fd9c8', style: 'Spacer. A gust that hurls foes far away.',
    walkSpeed: 250, jumpMul: 1.2,  maxHp: 92,  punchDmg: 6, punchRange: 36, kickDmg: 10, kickRange: 48,

  // --- Premium characters (unlocked by buying with wins) ---
  { name: 'Cowboy', color: '#c49a5a', style: 'Gunslinger. Lassos you airborne, then shoots — 38 dmg.',

    special: 'shadowslash', specialName: 'SHADOW SLASH', look: 'ninja', premium: true, costOff: 40, costOn: 20, sword: true, bodyScale: 0.9 },

    special: 'machinegun', specialName: 'MACHINE GUN', look: 'cyber', premium: true, costOff: 60, costOn: 30 },
  { name: 'Elemental', color: '#a64dff', style: 'Mage. RANDOM cataclysm: quake / tsunami / eruption / lightning.',
    walkSpeed: 200, jumpMul: 1.0, maxHp: 100, punchDmg: 6, punchRange: 38, kickDmg: 11, kickRange: 50,
    special: 'elemental', specialName: 'CATACLYSM', premium: true, costOff: 100, costOn: 50, elementalBody: true },
  { name: 'Berserker', color: '#cc1f3a', style: 'Rager. Hits HARDER the lower his HP. Wild random super.',
    walkSpeed: 215, jumpMul: 1.05, maxHp: 110, punchDmg: 7, punchRange: 40, kickDmg: 13, kickRange: 50,
    special: 'berserker', specialName: 'RAMPAGE', lowHpDamage: true, premium: true, costOff: 75, costOn: 38, bodyScale: 1.42, muscles: true, scarred: true,
    customKick: { name: 'RAGE SLAM', cooldown: 5, dmgMul: 2.0, effect: 'rageslam' } },
];
// Per-character punch/kick animation styles, so each fighter's attacks look different.
const PUNCH_ANIMS = ['jab', 'cross', 'hook', 'uppercut', 'hammer', 'palm', 'double', 'backfist'];
const KICK_ANIMS  = ['front', 'roundhouse', 'axe', 'sweep', 'knee', 'side', 'spin', 'flying'];
CHARS.forEach((c, i) => {
  if (!c.punchAnim) c.punchAnim = PUNCH_ANIMS[i % PUNCH_ANIMS.length];
  if (!c.kickAnim)  c.kickAnim  = KICK_ANIMS[(i * 3 + Math.floor(i / 8)) % KICK_ANIMS.length];
});

// Normal attacks. Per-char damage/range overrides come from CHARS.
const MOVES = {
  punch: { startup: 0.06, active: 0.05, recovery: 0.14, boxW: 26, boxH: 22, boxYOffset: 50,
           hitstun: 0.28, knockbackVx: 160, knockbackVy: -120, chipMul: 0.25,
           meterOnHit: 8, meterOnBlock: 4, pushOnBlock: 120, sfx: 'hit' },
  kick:  { startup: 0.10, active: 0.07, recovery: 0.22, boxW: 32, boxH: 26, boxYOffset: 30,
           hitstun: 0.40, knockbackVx: 320, knockbackVy: -260, chipMul: 0.30,
           meterOnHit: 12, meterOnBlock: 6, pushOnBlock: 200, sfx: 'kick' },
};

// Special timings (durations in seconds)
const SPECIALS = {
  beam:        { dur: 0.50, startup: 0.20 },

function drawProjectiles() {

    ctx.globalAlpha = Math.max(0, s.life / 0.5) * 0.8;
    ctx.strokeStyle = s.color; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.ellipse(s.x, s.y, s.r, s.r * 0.4, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
  }
}
function drawParticles() {
  for (const p of state.particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;
}
function drawFloatTexts() {
  ctx.font = 'bold 20px Courier New'; ctx.textAlign = 'center';
  for (const t of state.floatTexts) {
    ctx.globalAlpha = Math.min(1, t.life / t.maxLife);
    ctx.fillStyle = '#000'; ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color; ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
}
function drawBackground() {
  // sky
  const g = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  g.addColorStop(0, '#2a3050'); g.addColorStop(1, '#4a4060');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, GROUND_Y);
  // distant buildings
  ctx.fillStyle = '#232842';
  for (let i = 0; i < 9; i++) {
    const bw = 70, bx = i * 100 + 10, bh = 120 + (i * 53 % 90);
    ctx.fillRect(bx, GROUND_Y - bh, bw, bh);
  }
  // ground
  ctx.fillStyle = '#2b2436'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#3c3450'; ctx.fillRect(0, GROUND_Y, W, 5);
}
function drawBar(x, y, w, h, pct, color, align) {
  ctx.fillStyle = '#1a1a26'; ctx.fillRect(x, y, w, h);
  const fw = w * clamp(pct, 0, 1);
  ctx.fillStyle = color;
  if (align === 'right') ctx.fillRect(x + w - fw, y, fw, h);
  else ctx.fillRect(x, y, fw, h);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.strokeRect(x, y, w, h);
}
function drawSideHud(team, side) {
  const barW = 320, x = side === 'left' ? 20 : W - 20 - barW;
  let y = 18;
  for (const f of team) {
    drawBar(x, y, barW, 18, f.hp / f.maxHp, f.color, side === 'left' ? 'left' : 'right');
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px Courier New';
    ctx.textAlign = side === 'left' ? 'left' : 'right';
    ctx.fillText(f.name, side === 'left' ? x : x + barW, y + 33);
    const full = f.meter >= f.maxMeter;
    drawBar(x, y + 22, barW, 6, f.meter / f.maxMeter, full ? '#fff' : '#3a9bf0', side === 'left' ? 'left' : 'right');
    if (full) {
      ctx.fillStyle = '#ffd76b'; ctx.font = 'bold 10px Courier New';
      ctx.textAlign = side === 'left' ? 'right' : 'left';
      ctx.fillText('SPECIAL!', side === 'left' ? x + barW : x, y + 31);
    }
    y += 46;
  }
  ctx.textAlign = 'left';
}
function drawPips(team, cx, cy, right) {
  for (let i = 0; i < ROUNDS_TO_WIN; i++) {
    const px = cx + (right ? 1 : -1) * (i * 18);
    ctx.beginPath(); ctx.arc(px, cy, 6, 0, Math.PI * 2);
    ctx.fillStyle = i < state.teamRounds[team] ? '#ffd76b' : '#444';
    ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5; ctx.stroke();
  }
}
function drawHUD() {
  const teams = [...new Set(state.fighters.filter(f => !f.isMinion).map(f => f.team))];
  if (teams.length > 2) {
    // FFA HUD: compact horizontal bars for all players
    const players = state.fighters.filter(f => !f.isMinion);
    const barW = Math.min(190, Math.floor((W - 20) / players.length) - 10);
    players.forEach((f, idx) => {
      const bx = 10 + idx * (barW + 8), by = 10;
      drawBar(bx, by, barW, 15, f.hp / f.maxHp, f.color, 'left');
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Courier New'; ctx.textAlign = 'left';
      ctx.fillText(f.name, bx + 2, by + 26);
      const pips = (state.teamRounds && state.teamRounds[f.team]) || 0;
      for (let p = 0; p < ROUNDS_TO_WIN; p++) {
        ctx.beginPath(); ctx.arc(bx + p * 11 + 5, by + 35, 4, 0, Math.PI * 2);
        ctx.fillStyle = p < pips ? '#ffd76b' : '#444'; ctx.fill();
        ctx.strokeStyle = '#000'; ctx.lineWidth = 1; ctx.stroke();
      }
    });
    ctx.fillStyle = '#fff'; ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(Math.max(0, state.roundTime)), W / 2, 32);
    ctx.textAlign = 'left';
    return;
  }
  const t0 = state.fighters.filter(f => f.team === 0 && !f.isMinion);
  const t1 = state.fighters.filter(f => f.team === 1 && !f.isMinion);
  drawSideHud(t0, 'left'); drawSideHud(t1, 'right');
  // timer
  ctx.fillStyle = '#fff'; ctx.font = 'bold 28px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(Math.ceil(Math.max(0, state.roundTime)), W / 2, 62);
  // round pips
  drawPips(0, W / 2 - 60, 44, false);
  drawPips(1, W / 2 + 60, 44, true);
  ctx.textAlign = 'left';
  drawPauseButton();
}
function drawPauseButton() {
  if (state.mode !== 'fight' || (net && net.active)) return; // no pausing in online play
  const b = PAUSE_BTN;
  ctx.fillStyle = inPauseBtn() ? 'rgba(80,90,130,0.85)' : 'rgba(0,0,0,0.45)';
  ctx.fillRect(b.x, b.y, b.w, b.h);
  ctx.strokeStyle = '#8890b8'; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(b.x + 11, b.y + 6, 4, b.h - 12);
  ctx.fillRect(b.x + 19, b.y + 6, 4, b.h - 12);
}
function drawBanner() {
  ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fillRect(0, H / 2 - 50, W, 100);
  ctx.fillStyle = '#ffd76b'; ctx.font = 'bold 38px Courier New'; ctx.textAlign = 'center';
  ctx.fillText(state.banner, W / 2, H / 2 + 12);
  ctx.textAlign = 'left';
}
function drawHitboxes() {
  ctx.strokeStyle = '#f0f'; ctx.lineWidth = 1;
  for (const f of state.fighters) {
    const b = feetToBodyRect(f); ctx.strokeStyle = '#0f0'; ctx.strokeRect(b.x, b.y, b.w, b.h);
    const hb = computeHitbox(f); if (hb) { ctx.strokeStyle = '#f00'; ctx.strokeRect(hb.x, hb.y, hb.w, hb.h); }
  }
}
function draw() {
  let shx = 0, shy = 0;
  if (state.shake > 0) { shx = (Math.random() - 0.5) * state.shake; shy = (Math.random() - 0.5) * state.shake; }
  ctx.save(); ctx.translate(shx, shy);
  drawBackground();
  drawMedkits();
  drawTraps();
  if (state.fighters.length) {
    for (const f of state.fighters) drawFighter(f);
    for (const f of state.fighters) {
      let mine = f.isPlayer;
      if (net && net.active) {
        mine = (net.maxPlayers > 2) ? (state.fighters.indexOf(f) === net.mySlot) : (f.team === net.myTeam);
      }
      if (mine) drawMarker(f);
    }
    drawBeams(); drawFx(); drawShockwaves(); drawProjectiles(); drawParticles(); drawFloatTexts();
  }
  ctx.restore();
  if (state.mode === 'fight' || state.mode === 'roundOver' || state.mode === 'paused') drawHUD();
  if (state.mode === 'roundOver') drawBanner();
  if (net && net.active && state.countdown > 0 && !state.online_over) {
    const c = state.countdown;
    const txt = c > 2.4 ? '3' : c > 1.4 ? '2' : c > 0.4 ? '1' : 'GO!';
    ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fillRect(0, H / 2 - 60, W, 120);
    ctx.fillStyle = '#ffd76b'; ctx.font = 'bold 80px Courier New'; ctx.textAlign = 'center';
    ctx.fillText(txt, W / 2, H / 2 + 28); ctx.textAlign = 'left';
  }
  if (DEBUG && state.fighters.length) drawHitboxes();
}

// =====================================================================
// MAIN LOOP
// =====================================================================
function update(dt) {
  lastDt = dt;

  // Online play runs its own loop (host simulates, guest renders snapshots).
  if (net && net.active) { updateOnline(dt); return; }

  // Pause toggle (P / Esc key, or clicking the on-screen pause button)
  const pausePressed = justPressed.has('KeyP') || justPressed.has('Escape') ||
                       (mouseClicked && state.mode === 'fight' && inPauseBtn());
  if (pausePressed) {
    if (state.mode === 'fight') { pauseGame(); clearJustPressed(); mouseClicked = false; return; }
    if (state.mode === 'paused') { resumeGame(); clearJustPressed(); mouseClicked = false; return; }
  }
  if (state.mode === 'paused') { clearJustPressed(); mouseClicked = false; return; }

  if (state.shake > 0) state.shake = Math.max(0, state.shake - dt * 30);
  updateParticles(dt); updateFloatTexts(dt); updateFx(dt);
  mouseClicked = false;

  if (state.mode === 'roundOver') {
    state.roundOverTimer -= dt;
    if (state.roundOverTimer <= 0) nextRound();
    clearJustPressed(); return;
  }
  if (state.mode !== 'fight') { clearJustPressed(); return; }
  if (state.hitstop > 0) { state.hitstop -= dt; clearJustPressed(); return; }

  state.roundTime -= dt;
  for (const f of state.fighters) updateFighter(f, dt);
  cullMinions();
  resolveCombat();
  updateProjectiles(dt); updateShockwaves(dt); updateTraps(dt); updateMedkits(dt);

  if (state.winPendingTeam == null) {
    const r = checkRoundOver(state.fighters);
    if (r !== -1) { state.winPendingTeam = r; state.winPendingTimer = 3.0; }            // let the death animation play
    else if (state.roundTime <= 0) { state.winPendingTeam = timeoutWinner(); state.winPendingTimer = 3.0; }
  } else {
    state.winPendingTimer -= dt;
    if (state.winPendingTimer <= 0) { const w = state.winPendingTeam; state.winPendingTeam = null; endRound(w); }
  }

  clearJustPressed();
}
let lastT = 0;
function gameLoop(t) {
  const dt = Math.min((t - lastT) / 1000 || 0, 0.05);
  lastT = t;
  update(dt);
  draw();
  requestAnimationFrame(gameLoop);
}

// =====================================================================
// ONLINE 2-PLAYER (peer-to-peer via WebRTC / PeerJS)
// The host runs the authoritative match and streams snapshots; the guest
// sends its input and renders what it receives. Players join by a code.
// =====================================================================
let net = null;
const NO_INTENT = { left: false, right: false, jump: false, block: false, punch: false, kick: false, special: false };

function genCode() {
  const cs = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s = ''; for (let i = 0; i < 4; i++) s += cs[Math.floor(Math.random() * cs.length)];
  return s;
}
function baseNet() {
  return { active: false, isHost: false, code: '', peer: null, conn: null, conns: [], connected: false,
    phase: 'menu', myTeam: 0, mySlot: 0, maxPlayers: 2, gameMode: 'duel',
    localReady: false, remoteReady: false, remoteInput: NO_INTENT, inputs: {}, error: '', lineup: null,
    localChar: null, remoteChar: null, statsDone: false,
    slots: [{ charId: null, ready: false }],
    remoteWins: 0, remoteStyle: 'none', bet: null, betError: '' };
}
function send(obj) {
  if (!net) return;
  try {
    // Multi-player host: send to all conns; guest/2P: send via net.conn
    if (net.conns && net.conns.length > 0) {
      for (const c of net.conns) { try { if (c.conn && c.conn.open) c.conn.send(obj); } catch (e) {} }
    } else if (net.conn && net.conn.open) { net.conn.send(obj); }
  } catch (e) {}
}
function sendTo(slot, obj) {
  try {
    if (!net) return;
    const e = net.conns.find(c => c.slot === slot);
    if (e && e.conn && e.conn.open) e.conn.send(obj);
  } catch (e) {}
}
function sendProfile() { if (net) send({ type: 'profile', style: (myAccount ? myAccount.style : 'none'), wins: (myAccount ? (myAccount.onWins || 0) : 0) }); }
function proposeBet() {
  if (!net || !myAccount) return;
  const v = parseInt(accFieldVal('betAmt') || '0', 10) || 0;
  if (v <= 0) { net.betError = 'Enter how many wins to bet.'; renderOnlineUI(); return; }
  if (v > (myAccount.onWins || 0)) { net.betError = "You don't have that many wins."; renderOnlineUI(); return; }
  if (v > (net.remoteWins || 0)) { net.betError = "Invalid bet — player doesn't have enough wins."; renderOnlineUI(); return; }
  net.bet = { amount: v, by: 'me', agreed: false }; net.betError = '';
  send({ type: 'betPropose', amount: v }); renderOnlineUI();
}
function agreeBet() {
  if (!net || !net.bet || net.bet.by !== 'them') return;
  if (net.bet.amount > (myAccount ? (myAccount.onWins || 0) : 0)) { net.betError = "You don't have enough wins to take that bet."; renderOnlineUI(); return; }
  net.bet.agreed = true; net.betError = ''; send({ type: 'betAgree' }); renderOnlineUI();
}
function declineBet() { if (!net) return; net.bet = null; net.betError = ''; send({ type: 'betDecline' }); renderOnlineUI(); }
function onlineBetHTML() {
  if (!myAccount) return '<p class="small">Log into an account (with wins) to bet.</p>';
  let h = '<div style="background:#1c2030;border-radius:8px;padding:8px 14px;margin-top:6px;max-width:460px;">';
  if (net.bet && net.bet.agreed) {
    h += '💰 <b>Wagering ' + net.bet.amount + ' online wins this match!</b>';
  } else if (net.bet && net.bet.by === 'them') {
    h += 'Opponent bets <b>' + net.bet.amount + '</b> online wins. ' +
      '<button class="btn" style="font-size:13px;padding:4px 10px" onclick="agreeBet()">Agree</button>' +
      '<button class="btn" style="font-size:13px;padding:4px 10px" onclick="declineBet()">Decline</button>';
  } else if (net.bet && net.bet.by === 'me') {
    h += 'You bet <b>' + net.bet.amount + '</b> wins — waiting for opponent… ' +
      '<button class="btn" style="font-size:12px;padding:3px 8px" onclick="declineBet()">Cancel</button>';
  } else {
    h += '💰 Bet online wins (you have ' + (myAccount.onWins || 0) + ', they have ' + (net.remoteWins || 0) + '): ' +
      '<input id="betAmt" inputmode="numeric" style="width:60px;text-align:center;font-family:inherit;font-size:15px;border-radius:6px;border:1px solid #55607f;background:#10141f;color:#fff;"> ' +
      '<button class="btn" style="font-size:13px;padding:4px 10px" onclick="proposeBet()">Bet</button>';
  }
  if (net.betError) h += '<br><span style="color:#fc8">' + net.betError + '</span>';
  return h + '</div>';
}
function notify(msg) { if (typeof alert === 'function') alert(msg); }

function onlineOpen() {
  teardownNet(); net = baseNet(); net.phase = 'menu';
  state = freshState(); state.mode = 'onlineMenu';
  hideOverlays(); renderOnlineUI();
}
function peerErr(e) {
  const t = (e && e.type) || '';
  if (t === 'unavailable-id') return 'That code is taken — try Create again.';
  if (t === 'peer-unavailable') return 'No game found with that code.';
  if (t === 'network' || t === 'server-error') return 'Network problem reaching the connection service.';
  return 'Connection error' + (t ? (': ' + t) : '.');
}
function onlineCreate(maxP) {
  if (typeof Peer === 'undefined') { net.phase = 'error'; net.error = 'Networking failed to load (check your internet).'; renderOnlineUI(); return; }
  maxP = maxP || 2;
  net.isHost = true; net.myTeam = 0; net.mySlot = 0; net.maxPlayers = maxP;
  net.slots = []; for (let i = 0; i < maxP; i++) net.slots.push({ charId: null, ready: false });
  net.gameMode = maxP === 2 ? 'duel' : maxP === 3 ? 'ffa3' : 'ffa4';
  net.conns = []; net.inputs = {};
  net.code = genCode(); net.phase = 'connecting'; net.error = ''; renderOnlineUI();
  try {
    net.peer = new Peer('sbrawl-' + net.code);
    net.peer.on('open', () => { net.phase = 'waiting'; renderOnlineUI(); });
    net.peer.on('connection', c => setupConn(c));
    net.peer.on('error', e => { net.phase = 'error'; net.error = peerErr(e); renderOnlineUI(); });
  } catch (e) { net.phase = 'error'; net.error = String(e); renderOnlineUI(); }
}
function onlineJoin() {
  if (typeof Peer === 'undefined') { net.phase = 'error'; net.error = 'Networking failed to load (check your internet).'; renderOnlineUI(); return; }
  const inp = document.getElementById('joinCode');
  const code = (inp ? inp.value : '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
  if (code.length < 4) { net.error = 'Enter the 4-character code.'; renderOnlineUI(); return; }
  net.isHost = false; net.myTeam = 1; net.code = code; net.phase = 'connecting'; net.error = ''; renderOnlineUI();
  try {
    net.peer = new Peer();
    net.peer.on('open', () => {
      setupConn(net.peer.connect('sbrawl-' + code, { reliable: true }));
      setTimeout(() => { if (net && !net.connected && net.phase === 'connecting') { net.phase = 'error'; net.error = 'Could not find that game. Check the code.'; renderOnlineUI(); } }, 9000);
    });
    net.peer.on('error', e => { net.phase = 'error'; net.error = peerErr(e); renderOnlineUI(); });
  } catch (e) { net.phase = 'error'; net.error = String(e); renderOnlineUI(); }
}
// ---- Quick Match (codeless auto-pairing via shared matchmaking slots) ----
const MM_SLOTS = 6;
function shuffleSlots() {
  const a = []; for (let i = 0; i < MM_SLOTS; i++) a.push(i);
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
function quickMatch() {
  teardownNet(); net = baseNet(); net.phase = 'searching';
  state = freshState(); state.mode = 'onlineMenu';
  hideOverlays(); document.getElementById('onlineScreen').classList.remove('hidden');
  if (typeof Peer === 'undefined') { net.phase = 'error'; net.error = 'Networking failed to load (check your internet).'; renderOnlineUI(); return; }
  net.mmRounds = 0;
  renderOnlineUI();
  mmSeek();
}
function mmSeek() { // look for a player already waiting in a slot
  if (!net || net.phase !== 'searching') return;
  trySeekSlot(shuffleSlots(), 0);
}
function trySeekSlot(slots, i) {
  if (!net || net.phase !== 'searching') return;

        (curP >= maxP ? '<p style="color:#6f6">All players connected! Move to lobby&hellip;</p>' : '') +
        leaveBtn;
  } else if (net.phase === 'lobby' || net.phase === 'rematch') {
    const maxP = net.maxPlayers || 2;
    const isRematch = net.phase === 'rematch';
    h = '<h2>' + (isRematch ? (state.banner || 'ROUND OVER') : 'CHOOSE YOUR FIGHTER') + '</h2>';
    if (maxP > 2) {
      // Multi-player lobby
      h += onlineCharGridHTML();
      // Slot status panels
      h += '<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0;">';
      const slots = net.slots || [];
      for (let i = 0; i < maxP; i++) {
        const isMe = (i === net.mySlot);
        const slot = slots[i] || {};
        const charName = slot.charId != null ? CHARS[slot.charId].name : '(picking&hellip;)';
        const charColor = slot.charId != null ? CHARS[slot.charId].color : '#888';
        const rdyColor = slot.ready ? '#6f6' : '#f88';
        const rdyText = slot.ready ? '&#10003; Ready' : 'Not ready';
        h += '<div style="background:#1c2030;border:2px solid ' + (isMe ? '#ffd76b' : '#444') + ';border-radius:8px;padding:8px 14px;min-width:110px;text-align:center;">' +
             '<b style="color:' + (isMe ? '#ffd76b' : '#aab') + '">P' + (i + 1) + (isMe ? ' (you)' : '') + '</b><br>' +
             '<span style="color:' + charColor + ';font-size:13px">' + charName + '</span><br>' +
             '<span style="color:' + rdyColor + ';font-size:11px">' + rdyText + '</span></div>';
      }
      h += '</div>';
      // Mode selector (host only)
      if (net.isHost) {
        const modeOpts = maxP === 3
          ? [['ffa3', '1v1v1 (FFA)'], ['2v1', '2v1 (Teams)']]
          : [['ffa4', '1v1v1v1 (FFA)'], ['2v2', '2v2 (Teams)']];
        h += '<div style="margin:6px 0;"><b>Mode:</b> ';
        modeOpts.forEach(([k, label]) => {
          const sel = net.gameMode === k;
          h += '<button class="btn" style="font-size:13px;padding:5px 10px;' + (sel ? 'background:#3a9bf0;border-color:#fff;' : '') + '" onclick="onlineSetMode(\'' + k + '\')">' + label + '</button> ';
        });
        h += '</div>';
      } else {
        const modeLabels = { ffa3: '1v1v1 (FFA)', '2v1': '2v1', ffa4: '1v1v1v1 (FFA)', '2v2': '2v2 (Teams)' };
        h += '<p class="small">Mode: <b>' + (modeLabels[net.gameMode] || net.gameMode) + '</b></p>';
      }
      // Ready button
      const mySlotData = (net.slots || [])[net.mySlot] || {};
      const readyCount = (net.slots || []).filter(s => s.ready).length;
      const readyBtn = mySlotData.ready
        ? '<p>Waiting for all players&hellip; (' + readyCount + '/' + maxP + ' ready)</p>'
        : '<button class="btn" onclick="onlineReady()">' + (isRematch ? 'Play Again' : 'Ready') + '</button><p class="small">' + readyCount + '/' + maxP + ' ready</p>';
      h += readyBtn;
    } else {
      // 2P lobby (original)
      const cnt = (net.localReady ? 1 : 0) + (net.remoteReady ? 1 : 0);
      const opp = net.remoteChar != null ? CHARS[net.remoteChar].name : '&hellip;';
      h += onlineCharGridHTML() + '<p>Opponent picked: <b>' + opp + '</b></p>' + onlineBetHTML();
      const readyBtn = isRematch
        ? (net.localReady ? '<p>Waiting for your friend&hellip; (' + cnt + '/2 ready)</p>' : '<button class="btn" onclick="onlineReady()">Play Again</button><p>' + cnt + '/2 ready</p>')
        : ((net.localChar == null) ? '<p>Pick your fighter above.</p>' : (net.localReady ? '<p>Ready! Waiting for your friend&hellip; (' + cnt + '/2)</p>' : '<button class="btn" onclick="onlineReady()">Ready</button><p>' + cnt + '/2 ready</p>'));
      h += readyBtn;
    }
    h += leaveBtn;
  } else if (net.phase === 'error') {
    h = '<h2>Connection problem</h2><p style="color:#f88">' + (net.error || '') + '</p>' +
        '<button class="btn" onclick="onlineOpen()">Try Again</button><button class="btn" onclick="showTitle()">Main Menu</button>';
  }
  el.innerHTML = h;
}

// =====================================================================
// ACCOUNTS — username profiles with stats, shared via JSONBlob
// =====================================================================
const ACC_URL = 'https://jsonblob.com/api/jsonBlob/019ed1a7-96df-722f-8a69-805c4a616606';
function normalizeAccount(a) {
  if (!a) return a;
  if (a.dmg == null) a.dmg = 0; if (a.onWins == null) a.onWins = 0; if (a.offWins == null) a.offWins = 0;
  if (a.onKills == null) a.onKills = 0; if (a.offKills == null) a.offKills = 0;
  if (!a.charUses) a.charUses = {};
  if (!Array.isArray(a.ownedChars)) a.ownedChars = [];
  return a;
}
let myAccount = (function () { try { const s = localStorage.getItem('brawl_account'); return s ? normalizeAccount(JSON.parse(s)) : null; } catch (e) { return null; } })();
let allAccounts = {};
let matchTeamStats = { 0: { dmg: 0, kills: 0 }, 1: { dmg: 0, kills: 0 } };
let accView = { phase: 'menu', viewing: null, names: [] };

function blankStats(name) { return { name: name, dmg: 0, onWins: 0, offWins: 0, onKills: 0, offKills: 0, charUses: {}, ownedChars: [] }; }
function loadLocalAccounts() { try { return JSON.parse(localStorage.getItem('brawl_accounts') || '{}'); } catch (e) { return {}; } }
function persistLocal() {
  try {
    if (myAccount) {
      localStorage.setItem('brawl_account', JSON.stringify(myAccount));
      const m = loadLocalAccounts(); m[myAccount.name] = myAccount; // local cache so you can log back in offline / same device
      localStorage.setItem('brawl_accounts', JSON.stringify(m));
    }
  } catch (e) {}
}
function pushAccount() { // merge my account into the shared blob (read-modify-write)
  if (!myAccount) return;
  persistLocal();
  fetch(ACC_URL).then(r => r.json()).then(data => {
    if (!data || typeof data !== 'object') data = {};
    data[myAccount.name] = myAccount;
    return fetch(ACC_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
  }).catch(function () {});
}
function fetchAccounts(cb) {
  fetch(ACC_URL).then(r => r.json()).then(d => { allAccounts = (d && typeof d === 'object') ? d : {}; if (cb) cb(); }).catch(function () { if (cb) cb(); });
}
function hashPin(p) { // simple non-reversible obfuscation (not real security)
  let h = 2166136261; const s = 'brawl:' + p;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
  return (h >>> 0).toString(36);
}
function createAccount(name, pin) {
  name = (name || '').trim().slice(0, 16);
  if (!name) return false;
  myAccount = blankStats(name); myAccount.pin = hashPin(pin);
  persistLocal(); pushAccount(); return true;
}
function recordCharUse(id) { if (!myAccount || id == null) return; myAccount.charUses[id] = (myAccount.charUses[id] || 0) + 1; persistLocal(); }
function mostUsedChar(a) {
  let best = null, bn = -1; const cu = (a && a.charUses) || {};
  for (const k in cu) { if (cu[k] > bn) { bn = cu[k]; best = k; } }
  return (best != null && CHARS[best]) ? CHARS[best].name : '—';
}
function accEsc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function statsHTML(a) {
  a = a || {};
  return '<div style="text-align:left;display:inline-block;font-size:15px;line-height:1.9;background:#181d2c;padding:14px 24px;border-radius:10px;">' +
    'Damage dealt: <b>' + Math.round(a.dmg || 0) + '</b><br>' +
    'Online wins: <b>' + (a.onWins || 0) + '</b><br>' +
    'Offline wins: <b>' + (a.offWins || 0) + '</b><br>' +
    'Online kills: <b>' + (a.onKills || 0) + '</b><br>' +
    'Offline kills: <b>' + (a.offKills || 0) + '</b><br>' +
    'Most used: <b>' + accEsc(mostUsedChar(a)) + '</b></div>';
}
function openAccount() { hideOverlays(); document.getElementById('accountScreen').classList.remove('hidden'); accView.phase = 'menu'; renderAccount(); }
function renderAccount() {
  const el = document.getElementById('accountScreen'); let h = '';
  if (accView.phase === 'menu') {
    if (!myAccount) {
      const inp = 'font-family:inherit;font-size:20px;width:200px;text-align:center;padding:8px;border-radius:8px;border:2px solid #55607f;background:#1a1f2e;color:#fff;';
      h = '<h2>Account</h2>' +
        '<div class="row" style="flex-direction:column;align-items:center;gap:8px;">' +
        '<input id="accName" maxlength="16" placeholder="Username" style="' + inp + '">' +
        '<input id="accPin" maxlength="6" inputmode="numeric" placeholder="PIN" style="' + inp + '"></div>' +
        '<div class="row"><button class="btn" onclick="doCreateAccount()">Create</button>' +
        '<button class="btn" onclick="doLoginAccount()">Log In</button></div>' +
        (accView.error ? '<p style="color:#f88">' + accView.error + '</p>' : '<p class="small">New here? pick a name + PIN and Create. Returning? Log In.</p>') +
        '<button class="btn" onclick="openAccountsList()">View All Players</button>' +
        '<button class="btn" onclick="showTitle()">Back</button>';
    } else {
      h = '<h2 style="color:#ffd76b">' + accEsc(myAccount.name) + '</h2>' + statsHTML(myAccount) +
        '<div class="row"><button class="btn" onclick="openShop()">🛒 Shop</button>' +
        '<button class="btn" onclick="openAccountsList()">View All Players</button>' +
        '<button class="btn" onclick="logoutAccount()">Log Out</button></div>' +
        '<button class="btn" onclick="showTitle()">Back</button>';
    }
  } else if (accView.phase === 'shop') {
    h = '<h2>🛒 Character Shop</h2>' +
      '<p class="small">Wins are the currency. You have <b>' + (myAccount.offWins || 0) + '</b> offline wins &middot; <b>' + (myAccount.onWins || 0) + '</b> online wins.</p>' +
      '<div class="row" style="flex-direction:column;align-items:center;gap:6px;max-height:280px;overflow:auto;">';
    CHARS.forEach((c, idx) => {
      if (!c.premium) return;
      const owned = myAccount.ownedChars.indexOf(idx) >= 0;
      let right;
      if (owned) right = '<span style="color:#6f6">Owned</span>';
      else right = '<button class="btn" style="font-size:12px;padding:5px 9px" onclick="buyChar(' + idx + ',\'off\')">' + c.costOff + ' off-wins</button>' +
                   '<button class="btn" style="font-size:12px;padding:5px 9px" onclick="buyChar(' + idx + ',\'on\')">' + c.costOn + ' on-wins</button>';
      h += '<div class="row" style="width:460px;justify-content:space-between;align-items:center;background:#181d2c;border-radius:8px;padding:6px 12px;">' +
        '<span><b style="color:' + c.color + '">' + c.name + '</b> <span class="small">★ ' + c.specialName + '</span></span>' +
        '<span class="row" style="gap:6px">' + right + '</span></div>';
    });
    h += '</div>' +
      '<div class="row" style="margin-top:8px;"><input id="adminCode" placeholder="admin code" style="font-family:inherit;font-size:15px;width:150px;text-align:center;padding:6px;border-radius:8px;border:2px solid #55607f;background:#1a1f2e;color:#fff;"><button class="btn" onclick="adminUnlock()">Enter</button></div>' +
      (accView.error ? '<p style="color:#fc8">' + accView.error + '</p>' : '') +
      '<button class="btn" onclick="backToAccountMenu()">Back</button>';
  } else if (accView.phase === 'list') {
    accView.names = Object.keys(allAccounts).filter(n => n[0] !== '_').sort();
    h = '<h2>Players</h2><div class="row" style="max-width:520px;max-height:280px;overflow:auto;">';
    if (!accView.names.length) h += '<p>No players yet — be the first!</p>';
    accView.names.forEach((n, idx) => { h += '<button class="btn" style="width:230px" onclick="viewAccountIdx(' + idx + ')">' + accEsc(n) + '</button>'; });
    h += '</div><button class="btn" onclick="backToAccountMenu()">Back</button>';
  } else if (accView.phase === 'view') {
    const n = accView.viewing; const a = allAccounts[n] || blankStats(n);
    h = '<h2 style="color:#ffd76b">' + accEsc(n) + '</h2>' + statsHTML(a) + '<button class="btn" onclick="openAccountsList()">Back to Players</button>';
  }
  el.innerHTML = h;
}
function accFieldVal(id) { const e = document.getElementById(id); return e ? e.value : ''; }
function doCreateAccount() {
  const name = accFieldVal('accName').trim().slice(0, 16);
  const pin = accFieldVal('accPin').trim();
  if (!name || !pin) { accView.error = 'Enter a username and a PIN.'; renderAccount(); return; }
  accView.error = 'Checking…'; renderAccount();
  fetchAccounts(function () {
    if (allAccounts[name] || loadLocalAccounts()[name]) { accView.error = 'That name is taken — Log In instead.'; renderAccount(); return; }
    createAccount(name, pin); accView.error = ''; accView.phase = 'menu'; renderAccount();
  });
}
function doLoginAccount() {
  const name = accFieldVal('accName').trim().slice(0, 16);
  const pin = accFieldVal('accPin').trim();
  if (!name || !pin) { accView.error = 'Enter your username and PIN.'; renderAccount(); return; }
  accView.error = 'Checking…'; renderAccount();
  fetchAccounts(function () {
    const acc = allAccounts[name] || loadLocalAccounts()[name]; // online store first, then this device's cache
    if (!acc) { accView.error = 'No account with that name.'; renderAccount(); return; }
    if (acc.pin !== hashPin(pin)) { accView.error = 'Wrong PIN.'; renderAccount(); return; }
    myAccount = normalizeAccount(acc); persistLocal(); accView.error = ''; accView.phase = 'menu'; renderAccount();
  });
}
function openAccountsList() { accView.phase = 'list'; renderAccount(); fetchAccounts(function () { if (accView.phase === 'list') renderAccount(); }); }
function viewAccountIdx(i) { accView.viewing = accView.names[i]; accView.phase = 'view'; renderAccount(); }
function backToAccountMenu() { accView.phase = 'menu'; accView.error = ''; renderAccount(); }
function logoutAccount() { myAccount = null; try { localStorage.removeItem('brawl_account'); } catch (e) {} accView.phase = 'menu'; renderAccount(); }
function openShop() { if (!myAccount) return; accView.phase = 'shop'; accView.error = ''; renderAccount(); }
function buyChar(idx, cur) {
  if (!myAccount) return;
  const c = CHARS[idx];
  if (!c || !c.premium) return;
  if (myAccount.ownedChars.indexOf(idx) >= 0) return;
  const cost = (cur === 'off') ? c.costOff : c.costOn;
  const have = (cur === 'off') ? (myAccount.offWins || 0) : (myAccount.onWins || 0);
  if (have < cost) { accView.error = 'Not enough ' + (cur === 'off' ? 'offline' : 'online') + ' wins (need ' + cost + ').'; renderAccount(); return; }
  if (cur === 'off') myAccount.offWins -= cost; else myAccount.onWins -= cost;
  myAccount.ownedChars.push(idx);
  persistLocal(); pushAccount();
  accView.error = 'Unlocked ' + c.name + '! Pick them on the character-select screen.'; renderAccount();
}
function adminUnlock() {
  if (!myAccount) return;
  const code = (accFieldVal('adminCode') || '').trim().toLowerCase();
  if (code !== 'admin') { accView.error = 'Wrong admin code.'; renderAccount(); return; }
  CHARS.forEach((c, idx) => { if (c.premium && myAccount.ownedChars.indexOf(idx) < 0) myAccount.ownedChars.push(idx); });
  persistLocal(); pushAccount();
  accView.error = 'Admin unlocked — all characters are yours!'; renderAccount();
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azi's Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a1a;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
  }

  /* Animated star background */
  .stars {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }
  .star {
    position: absolute;
    border-radius: 50%;
    background: white;
    animation: twinkle var(--d) ease-in-out infinite;
    animation-delay: var(--delay);
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.4); }
  }

  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 40px 20px;
  }

  h1 {
    font-size: clamp(2.5rem, 8vw, 5rem);
    font-weight: 900;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #ff6b35, #f7c59f, #ffe66d, #4ecdc4, #45b7d1);
    background-size: 300%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s linear infinite;
    margin-bottom: 8px;
  }

  @keyframes shimmer {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  .subtitle {
    color: #888;
    font-size: 1rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 60px;
  }

  .games-grid {
    display: flex;
    gap: 32px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .game-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    background: rgba(255,255,255,0.04);
    border: 2px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 36px 40px;
    width: 240px;
    transition: transform 0.2s, border-color 0.2s, background 0.2s, box-shadow 0.2s;
    cursor: pointer;
  }

  .game-card:hover {
    transform: translateY(-8px) scale(1.03);
    border-color: var(--accent);
    background: rgba(255,255,255,0.08);
    box-shadow: 0 16px 48px var(--glow);
  }

  .game-icon {
    font-size: 5rem;
    margin-bottom: 20px;
    display: block;
    filter: drop-shadow(0 4px 12px var(--glow));
    animation: float 3s ease-in-out infinite;
    animation-delay: var(--float-delay, 0s);
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .game-name {
    color: #fff;
    font-size: 1.3rem;
    font-weight: 800;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .game-desc {
    color: #aaa;
    font-size: 0.82rem;
    line-height: 1.5;
  }

  .play-btn {
    margin-top: 20px;
    padding: 10px 28px;
    border-radius: 100px;
    border: none;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #fff;
    background: var(--accent);
    box-shadow: 0 4px 16px var(--glow);
    cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
    pointer-events: none;
  }

  .game-card:hover .play-btn {
    transform: scale(1.07);
  }

  /* Individual card themes */
  .card-brawlers {
    --accent: #ff4d4d;
    --glow: rgba(255,77,77,0.35);
  }
  .card-dungeon {
    --accent: #a259ff;
    --glow: rgba(162,89,255,0.35);
  }
  .card-straycat {
    --accent: #ff9933;
    --glow: rgba(255,153,51,0.35);
  }

  footer {
    position: relative;
    z-index: 1;
    margin-top: 56px;
    color: #444;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<!-- Starfield -->
<div class="stars" id="stars"></div>

<div class="container">
  <h1>Azi's Games</h1>
  <p class="subtitle">pick a game and play</p>

  <div class="games-grid">

    <a class="game-card card-brawlers" href="fighter.html">
      <span class="game-icon" style="--float-delay:0s">🥊</span>
      <span class="game-name">Brawlers</span>
      <span class="game-desc">12 fighters, online multiplayer,<br>custom special moves</span>
      <span class="play-btn">Play</span>
    </a>

    <a class="game-card card-dungeon" href="dungeon_fighter.html">
      <span class="game-icon" style="--float-delay:0.5s">⚔️</span>
      <span class="game-name">Dungeon Fighter</span>
      <span class="game-desc">Explore dungeons,<br>battle enemies, survive</span>
      <span class="play-btn">Play</span>
    </a>

    <a class="game-card card-straycat" href="stray_cat.html">
      <span class="game-icon" style="--float-delay:1s">🐱</span>
      <span class="game-name">Stray Cat City</span>
      <span class="game-desc">Jump trash cans, find food,<br>make friends &amp; fight cats</span>
      <span class="play-btn">Play</span>
    </a>

  </div>
</div>

<footer>made by azi</footer>

<script>
  // Generate starfield
  const container = document.getElementById('stars');
  for (let i = 0; i < 120; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      left: ${Math.random() * 100}%;
      top: ${Math.random() * 100}%;
      width: ${size}px;
      height: ${size}px;
      --d: ${2 + Math.random() * 4}s;
      --delay: ${Math.random() * 4}s;
      opacity: ${0.1 + Math.random() * 0.3};
    `;
    container.appendChild(s);
  }
</script>

</body>
</html>

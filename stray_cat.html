<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stray Cat City</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#000; display:flex; justify-content:center; align-items:center; min-height:100vh; }
canvas { display:block; }
</style>
</head>
<body>
<canvas id="c" width="900" height="540"></canvas>
<script>
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 900, H = 540, GROUND = 455;

// --- Input ---
const keys = {}, wasKeys = {};
let mouse_x = null, mouse_y = null;
document.addEventListener('keydown', e => { keys[e.code] = true; e.preventDefault(); });
document.addEventListener('keyup',   e => { keys[e.code] = false; });
cv.addEventListener('mousemove', e => { const r=cv.getBoundingClientRect(); mouse_x=e.clientX-r.left; mouse_y=e.clientY-r.top; });
cv.addEventListener('click', e => {
  const r=cv.getBoundingClientRect(); const mx=e.clientX-r.left, my=e.clientY-r.top;
  if (gState==='title'||gState==='gameover'){
    if (mx>=W/2-70&&mx<=W/2+70&&my>=420&&my<=442) window.location.href='index.html';
  }
});
function jp(c) { return keys[c] && !wasKeys[c]; } // just pressed

// --- Pseudo-random (deterministic by seed) ---
function sr(s) { const x = Math.sin(s * 9301 + 49297) * 233280; return x - Math.floor(x); }

// --- Game state ---
let gState = 'title';
let score = 0, bestScore = +(localStorage.getItem('scc_best') || 0);
let frame = 0;
let camX = 0;
let worldEnd = 0;

const GRAVITY = 0.55;
const CAT_COLORS = ['#aaa','#c8a060','#fff','#777','#d4a070','#88aacc','#bb7744','#aa88bb'];
const CAT_NAMES  = ['Mittens','Shadow','Luna','Mochi','Patches','Cleo','Oreo','Biscuit','Pumpkin','Ghost','Socks','Bean'];

// --- Player ---
const P = {
  x:150, y:GROUND, vx:0, vy:0, w:30, h:24,
  dir:1, onGround:false,
  hp:100, maxHp:100,
  hunger:100, maxHunger:100, hungerTick:0,
  attackCd:0, scratchAnim:0, invincible:0,
  color:'#e8933a',
};

// --- World ---
let platforms = []; // {x,y,w,h,type,searched}
let npcs = [];      // see mkNpc
let drops = [];     // food on ground
let floats = [];    // floating text

function mkNpc(x, type) {
  return {
    x, y:GROUND, vx:0, vy:0, w:28, h:22,
    dir: Math.random()<0.5?1:-1,
    hp:type==='enemy'?50:35, maxHp:type==='enemy'?50:35,
    type,          // 'enemy' | 'neutral' | 'friend'
    state:'wander',
    timer: 60+Math.random()*120,
    attackCd:0, scratchAnim:0, invincible:0,
    onGround:true,
    color: CAT_COLORS[Math.floor(Math.random()*CAT_COLORS.length)],
    name:  CAT_NAMES [Math.floor(Math.random()*CAT_NAMES.length)],
    dead:false,
  };
}

const FOODS = [
  {name:'Fish', color:'#80c0ff', hunger:30, pts:20},
  {name:'Pizza',color:'#ffaa44', hunger:25, pts:15},
  {name:'Milk', color:'#eef',    hunger:20, pts:12},
  {name:'Bone', color:'#ddd',    hunger:15, pts:8 },
];
function mkDrop(x, y) {
  const f = FOODS[Math.floor(Math.random()*FOODS.length)];
  return {...f, x, y, vy:-5};
}

function float(x, y, text, color) {
  floats.push({x, y, text, color: color||'#fff', life:60});
}

// --- World generation ---
function genChunk(from, to) {
  let x = from + 60 + Math.random()*80;
  while (x < to) {
    const r = Math.random();
    if (r < 0.22) {
      // Trash can
      platforms.push({x, y:GROUND-48, w:30, h:48, type:'trash', searched:false});
      x += 65 + Math.random()*55;
    } else if (r < 0.40) {
      // Dumpster
      platforms.push({x, y:GROUND-72, w:76, h:72, type:'dumpster', searched:false});
      x += 130 + Math.random()*90;
    } else if (r < 0.57) {
      // Boxes
      const bh = 28 + Math.floor(Math.random()*3)*20;
      platforms.push({x, y:GROUND-bh, w:50, h:bh, type:'box'});
      x += 90 + Math.random()*70;
    } else if (r < 0.70) {
      // Fence
      platforms.push({x, y:GROUND-54, w:110+Math.random()*90, h:10, type:'fence'});
      x += 190 + Math.random()*110;
    } else if (r < 0.83) {
      // High ledge
      platforms.push({x, y:GROUND-155-Math.random()*70, w:85, h:14, type:'ledge'});
      x += 160 + Math.random()*100;
    } else {
      // Fire escape (two levels)
      platforms.push({x, y:GROUND-115, w:65, h:12, type:'escape'});
      platforms.push({x, y:GROUND-205, w:65, h:12, type:'escape'});
      x += 200 + Math.random()*120;
    }
  }
  // Spawn cats
  for (let nx = from+200; nx < to; nx += 260+Math.random()*180) {
    npcs.push(mkNpc(nx, Math.random()<0.5 ? 'enemy' : 'neutral'));
  }
}

function initGame() {
  platforms = []; npcs = []; drops = []; floats = [];
  camX = 0; worldEnd = 0; frame = 0; score = 0;
  P.x=150; P.y=GROUND; P.vx=P.vy=0;
  P.hp=P.maxHp; P.hunger=P.maxHunger; P.hungerTick=0;
  P.onGround=false; P.dir=1;
  P.attackCd=P.scratchAnim=P.invincible=0;
  genChunk(0, 2800); worldEnd = 2800;
}

// --- Collision ---
function collidePlats(e) {
  e.onGround = false;
  if (e.y >= GROUND) { e.y=GROUND; e.vy=0; e.onGround=true; }
  for (const p of platforms) {
    const eL=e.x-e.w/2, eR=e.x+e.w/2, eB=e.y, eT=e.y-e.h;
    const pL=p.x, pR=p.x+p.w, pT=p.y, pB=p.y+p.h;
    if (eR<=pL||eL>=pR||eB<=pT||eT>=pB) continue;
    const oY=Math.min(eB-pT, pB-eT), oX=Math.min(eR-pL, pR-eL);
    if (oY < oX) {
      if (e.vy>=0 && eB-e.vy<=pT+4) { e.y=pT; e.vy=0; e.onGround=true; }
      else if (e.vy<=0)              { e.y=pB+e.h; e.vy=0; }
    } else {
      e.x = e.x < p.x+p.w/2 ? pL-e.w/2 : pR+e.w/2;
      e.vx = 0;
    }
  }
}

function distX(a,b) { return Math.abs(a.x-b.x); }

// --- UPDATE ---
function update() {
  if (gState !== 'playing') return;
  frame++;

  // Extend world
  if (P.x + W > worldEnd - 600) {
    genChunk(worldEnd, worldEnd+2200);
    worldEnd += 2200;
    const cull = camX - 300;
    platforms = platforms.filter(p => p.x+p.w > cull);
    npcs      = npcs.filter(n => n.x > cull);
    drops     = drops.filter(d => d.x > cull);
  }

  // === PLAYER MOVEMENT ===
  const spd = 3.8;
  if (keys['KeyA']||keys['ArrowLeft'])       { P.vx=-spd; P.dir=-1; }
  else if (keys['KeyD']||keys['ArrowRight']) { P.vx= spd; P.dir= 1; }
  else P.vx *= 0.6;

  if ((jp('KeyW')||jp('ArrowUp')||jp('Space')) && P.onGround) P.vy=-11.5;

  P.vy += GRAVITY;
  P.x += P.vx; P.y += P.vy;
  collidePlats(P);
  if (P.x - camX < 55) P.x = camX + 55;

  if (P.attackCd  > 0) P.attackCd--;
  if (P.scratchAnim>0) P.scratchAnim--;
  if (P.invincible > 0) P.invincible--;

  // === ATTACK (J or Z) ===
  if ((jp('KeyJ')||jp('KeyZ')) && P.attackCd===0) {
    P.attackCd=36; P.scratchAnim=14;
    for (const n of npcs) {
      if (n.type!=='enemy' || n.dead) continue;
      const inFront = P.dir===1 ? (n.x>P.x-15 && n.x<P.x+68) : (n.x<P.x+15 && n.x>P.x-68);
      if (inFront && Math.abs(n.y-P.y)<45) {
        n.hp -= 22; n.invincible=22; n.vx=P.dir*5;
        float(n.x, n.y-30, '-22', '#ff6666');
        if (n.hp<=0) { n.dead=true; score+=50; float(n.x, n.y-50, '+50 KO!', '#ffff44'); }
      }
    }
  }

  // === SEARCH TRASH (S / Down) ===
  if (jp('KeyS')||jp('ArrowDown')) {
    for (const p of platforms) {
      if (!['trash','dumpster'].includes(p.type) || p.searched) continue;
      const cx = p.x+p.w/2;
      if (Math.abs(P.x-cx)<65 && P.y===GROUND) {
        p.searched = true;
        const count = p.type==='dumpster' ? 2 : 1;
        for (let i=0; i<count; i++) drops.push(mkDrop(cx+(i-0.5)*35, p.y-10));
        float(cx, p.y-30, 'Found food!', '#ffe44e');
      }
    }
  }

  // === BEFRIEND (F) ===
  if (jp('KeyF')) {
    for (const n of npcs) {
      if (n.type==='neutral' && distX(P,n)<65 && n.onGround) {
        n.type='friend'; n.state='follow'; score+=30;
        float(n.x, n.y-40, `${n.name} joined! +30`, '#ff88ff');
      }
    }
  }

  // === HUNGER ===
  P.hungerTick++;
  if (P.hungerTick>=200) {
    P.hungerTick=0;
    P.hunger = Math.max(0, P.hunger-3);
    if (P.hunger<=0) { P.hp-=2; float(P.x, P.y-40,'Starving!','#ff4444'); }
  }

  // === FOOD DROPS ===
  for (const d of drops) {
    d.vy += 0.4; d.y += d.vy;
    if (d.y >= GROUND) { d.y=GROUND; d.vy=0; }
    if (!d.collected && Math.abs(d.x-P.x)<22 && Math.abs(d.y-P.y)<28) {
      d.collected=true;
      P.hunger = Math.min(P.maxHunger, P.hunger+d.hunger);
      score += d.pts;
      float(P.x, P.y-40, `${d.name} +${d.hunger} hunger`, '#aaff88');
    }
  }
  drops = drops.filter(d => !d.collected);

  // === NPCs ===
  for (const n of npcs) {
    if (n.dead) continue;
    n.vy += GRAVITY;
    if (n.invincible>0) n.invincible--;
    if (n.attackCd  >0) n.attackCd--;
    if (n.scratchAnim>0)n.scratchAnim--;
    n.timer--;

    if (n.type==='enemy') {
      const dp = distX(n, P);
      if (n.state==='wander') {
        if (n.timer<=0) { n.dir=Math.random()<0.5?1:-1; n.timer=60+Math.random()*100; }
        n.vx = n.dir * 1.1;
        if (dp < 230) n.state='chase';
      } else {
        // chase/fight
        if (dp > 380) n.state='wander';
        n.dir = P.x>n.x?1:-1;
        n.vx = n.dir * 2.3;
        if (dp<55 && n.attackCd===0 && n.onGround) {
          n.attackCd=85; n.scratchAnim=14;
          if (P.invincible===0) {
            P.hp-=12; P.invincible=45; P.vx=n.dir*3;
            float(P.x, P.y-40,'-12','#ff5555');
          }
        }
      }

    } else if (n.type==='neutral') {
      if (n.timer<=0) { n.dir=Math.random()<0.5?1:-1; n.timer=80+Math.random()*150; }
      n.vx = n.dir * 0.9;

    } else if (n.type==='friend') {
      // Attack nearby enemies
      let target = null;
      for (const e of npcs) {
        if (e.type==='enemy' && !e.dead && distX(n,e)<170) { target=e; break; }
      }
      if (target) {
        n.dir = target.x>n.x?1:-1;
        n.vx = n.dir*2.6;
        if (distX(n,target)<52 && n.attackCd===0) {
          n.attackCd=95; n.scratchAnim=14;
          target.hp-=12; target.invincible=22; target.vx=n.dir*4;
          float(target.x, target.y-30,'-12','#ff88aa');
          if (target.hp<=0) { target.dead=true; score+=30; float(target.x, target.y-50,'KO! +30','#ffff66'); }
        }
      } else {
        // Follow player
        const idx = npcs.filter(x=>x.type==='friend').indexOf(n);
        const targetX = P.x - P.dir*(65 + idx*32);
        const dx = targetX - n.x;
        if (Math.abs(dx)>18) { n.dir=dx>0?1:-1; n.vx=n.dir*2.2; }
        else n.vx = 0;
        // Jump to follow if player is on a platform above
        if (P.y < n.y - 40 && n.onGround && Math.abs(dx)<120) n.vy=-10;
      }
    }

    n.x += n.vx; n.y += n.vy;
    collidePlats(n);
  }
  npcs = npcs.filter(n=>!n.dead);

  // === FLOAT TEXTS ===
  for (const f of floats) f.life--;
  floats = floats.filter(f=>f.life>0);

  // === CAMERA ===
  const tgt = P.x - W*0.3;
  camX += (tgt-camX)*0.13;
  if (camX<0) camX=0;

  // === SCORE (distance) ===
  score = Math.max(score, Math.floor((P.x-150)/15));

  // === DEATH ===
  if (P.hp<=0 || P.y > H+200) {
    if (score>bestScore) { bestScore=score; localStorage.setItem('scc_best',bestScore); }
    gState='gameover';
  }
}

// --- DRAWING ---

function drawBg() {
  // Sky gradient
  const sky = ctx.createLinearGradient(0,0,0,GROUND);
  sky.addColorStop(0,'#04041a'); sky.addColorStop(1,'#111130');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  // Moon
  ctx.fillStyle='#ffffcc';
  ctx.beginPath(); ctx.arc(W*0.82-camX*0.008, 55, 34, 0, Math.PI*2); ctx.fill();

  // Stars
  ctx.globalAlpha=1;
  for (let i=0;i<90;i++){
    const sx=sr(i*7.3)*W, sy=sr(i*7.3+1)*(GROUND*0.65);
    const tw=0.3+0.7*Math.abs(Math.sin(frame*0.025+i*1.3));
    ctx.globalAlpha=tw*0.8; ctx.fillStyle='#fff';
    const ss=sr(i+0.5)<0.3?2:1;
    ctx.fillRect(sx,sy,ss,ss);
  }
  ctx.globalAlpha=1;

  // Far buildings (parallax 0.28)
  const bgO=camX*0.28, bgS=Math.floor(bgO/105)*105;
  for (let bx=bgS-105; bx<bgO+W+105; bx+=105){
    const sd=bx/105, bh=70+sr(sd)*190, bw=50+sr(sd+0.1)*60;
    ctx.fillStyle=`hsl(220,12%,${7+sr(sd+0.2)*8}%)`;
    ctx.fillRect(bx-bgO, GROUND-bh, bw, bh);
    for (let wy=GROUND-bh+10; wy<GROUND-10; wy+=22){
      for (let wx=bx-bgO+7; wx<bx-bgO+bw-8; wx+=16){
        const lit=sr(sd*77+(wx|0)*0.03+wy*0.01)>0.42;
        ctx.fillStyle=lit?`rgba(255,230,90,${0.3+sr(sd+wx)*0.4})`:'#0a0f1e';
        ctx.fillRect(wx,wy,10,12);
      }
    }
  }

  // Mid buildings (parallax 0.6)
  const midO=camX*0.6, midS=Math.floor(midO/90)*90;
  for (let bx=midS-90; bx<midO+W+90; bx+=90){
    const sd=bx/90+400, bh=55+sr(sd)*110, bw=40+sr(sd+0.1)*50;
    ctx.fillStyle=`hsl(220,12%,${10+sr(sd+0.2)*8}%)`;
    ctx.fillRect(bx-midO, GROUND-bh, bw, bh);
  }

  // Ground / sidewalk
  ctx.fillStyle='#222232'; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#2e2e42'; ctx.fillRect(0,GROUND,W,5);

  // Pavement markings
  const lo=camX%90;
  ctx.strokeStyle='#333345'; ctx.lineWidth=1;
  for (let lx=-lo; lx<W+90; lx+=90){
    ctx.beginPath(); ctx.moveTo(lx,GROUND+2); ctx.lineTo(lx,H); ctx.stroke();
  }

  // Streetlights
  const slO=camX%220;
  for (let sx=-slO; sx<W+220; sx+=220){
    ctx.strokeStyle='#445'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(sx+15,GROUND); ctx.lineTo(sx+15,GROUND-100);
    ctx.lineTo(sx+45,GROUND-100); ctx.stroke();
    // Glow
    const grd=ctx.createRadialGradient(sx+45,GROUND-100,0,sx+45,GROUND-100,55);
    grd.addColorStop(0,'rgba(255,220,100,0.18)');
    grd.addColorStop(1,'rgba(255,220,100,0)');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(sx+45,GROUND-100,55,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#ffe080';
    ctx.beginPath(); ctx.arc(sx+45,GROUND-100,4,0,Math.PI*2); ctx.fill();
  }
}

function drawPlatforms() {
  for (const p of platforms){
    const px=p.x-camX;
    if (px+p.w<-60||px>W+60) continue;
    const py=p.y;
    switch(p.type){
      case 'trash':
        // Can body
        ctx.fillStyle=p.searched?'#334':'#446677';
        ctx.fillRect(px+2, py+5, p.w-4, p.h-5);
        // Lid
        ctx.fillStyle=p.searched?'#223':'#55889a';
        ctx.fillRect(px-1, py, p.w+2, 7);
        // Label stripe
        if (!p.searched){ ctx.fillStyle='#88aacc'; ctx.fillRect(px+5,py+15,p.w-10,6); }
        break;
      case 'dumpster':
        ctx.fillStyle=p.searched?'#334':'#446655';
        ctx.fillRect(px, py+8, p.w, p.h-8);
        // Lid (open if searched)
        ctx.fillStyle=p.searched?'#223':'#558866';
        if (p.searched){ ctx.fillRect(px, py, p.w, 10); }
        else {
          ctx.fillRect(px-2, py, p.w/2+2, 10);
          ctx.fillRect(px+p.w/2, py, p.w/2+2, 10);
        }
        // Wheels
        ctx.fillStyle='#222'; ctx.beginPath(); ctx.arc(px+10,py+p.h,7,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(px+p.w-10,py+p.h,7,0,Math.PI*2); ctx.fill();
        break;
      case 'box': {
        const layers=Math.round(p.h/28);
        for (let l=0;l<layers;l++){
          const ly=py+p.h-28*(l+1);
          ctx.fillStyle=`hsl(30,40%,${22+l*5}%)`;
          ctx.fillRect(px+1,ly+1,p.w-2,27);
          ctx.strokeStyle=`hsl(30,30%,15%)`;ctx.lineWidth=1;
          ctx.strokeRect(px+1,ly+1,p.w-2,27);
          ctx.strokeStyle='rgba(255,255,255,0.08)';
          ctx.beginPath(); ctx.moveTo(px+1,ly+14); ctx.lineTo(px+p.w-1,ly+14); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(px+p.w/2,ly+1); ctx.lineTo(px+p.w/2,ly+28); ctx.stroke();
        }
        break;
      }
      case 'fence':
        ctx.fillStyle='#5a4a3a'; ctx.fillRect(px, py+3, p.w, p.h-3);
        for (let fx=px; fx<px+p.w; fx+=14){
          ctx.fillStyle='#6a5a4a'; ctx.fillRect(fx, py-10, 8, p.h+10);
        }
        break;
      case 'ledge': case 'escape':
        ctx.fillStyle='#555566'; ctx.fillRect(px, py, p.w, p.h);
        ctx.fillStyle='rgba(255,255,255,0.08)'; ctx.fillRect(px, py, p.w, 2);
        // Escape has railing
        if (p.type==='escape'){
          ctx.strokeStyle='#444455'; ctx.lineWidth=2;
          ctx.strokeRect(px, py-20, p.w, 20);
          for (let rx=px+8; rx<px+p.w-4; rx+=10){
            ctx.beginPath(); ctx.moveTo(rx,py); ctx.lineTo(rx,py-20); ctx.stroke();
          }
        }
        break;
    }
  }
}

// Draw a cat at world position (x=feet-center, y=feet-bottom)
function drawCat(x, y, dir, color, hp, maxHp, type, scratchAnim, invincible) {
  const sx = x - camX;
  if (sx < -60 || sx > W+60) return;
  ctx.save();
  ctx.translate(sx, y);
  if (dir<0) ctx.scale(-1,1);

  const flicker = invincible>0 && Math.floor(invincible/4)%2===0;
  if (flicker) { ctx.restore(); return; }

  // Shadow
  ctx.fillStyle='rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(0,0,16,4,0,0,Math.PI*2); ctx.fill();

  // Tail
  ctx.strokeStyle = darken(color,0.7);
  ctx.lineWidth=5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-13,-4);
  const tailWag = Math.sin(Date.now()*0.005+(x%100))*0.3;
  ctx.quadraticCurveTo(-28,-20+tailWag*8, -20,-34+tailWag*8);
  ctx.stroke();

  // Body
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.roundRect(-14,-22,28,22,8); ctx.fill();

  // Belly (lighter)
  ctx.fillStyle=lighten(color,1.3);
  ctx.beginPath(); ctx.ellipse(2,-10,7,9,0,0,Math.PI*2); ctx.fill();

  // Legs
  ctx.fillStyle=darken(color,0.85);
  ctx.fillRect(-10,-4,8,6); ctx.fillRect(5,-4,8,6);

  // Paw swipe if attacking
  if (scratchAnim>0){
    const ext = scratchAnim/14;
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.globalAlpha=ext;
    ctx.beginPath(); ctx.moveTo(14,-12); ctx.lineTo(14+22*ext,-12-6*ext); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,-10); ctx.lineTo(14+22*ext,-9+2*ext); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(14,-8); ctx.lineTo(14+22*ext,-4+6*ext); ctx.stroke();
    ctx.globalAlpha=1;
  }

  // Head
  ctx.fillStyle=color;
  ctx.beginPath(); ctx.arc(10,-28,12,0,Math.PI*2); ctx.fill();

  // Ears
  ctx.fillStyle=darken(color,0.8);
  ctx.beginPath(); ctx.moveTo(2,-36); ctx.lineTo(5,-46); ctx.lineTo(10,-36); ctx.fill();
  ctx.beginPath(); ctx.moveTo(13,-36); ctx.lineTo(17,-46); ctx.lineTo(21,-36); ctx.fill();
  // Inner ears
  ctx.fillStyle='#ffaaaa';
  ctx.beginPath(); ctx.moveTo(4,-37); ctx.lineTo(5.5,-44); ctx.lineTo(9,-37); ctx.fill();
  ctx.beginPath(); ctx.moveTo(14,-37); ctx.lineTo(16,-44); ctx.lineTo(19.5,-37); ctx.fill();

  // Eyes
  const eyeCol = type==='enemy' ? '#ff4444' : (type==='friend' ? '#44ff88' : '#333');
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(6,-28,3.5,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(14,-28,3.5,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=eyeCol; ctx.beginPath(); ctx.arc(7,-28,2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(15,-28,2,0,Math.PI*2); ctx.fill();

  // Nose & whiskers
  ctx.fillStyle='#ff9999'; ctx.beginPath(); ctx.arc(10,-24,2,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=1;
  for (const [wx,wy,ex,ey] of [[-4,-24,-16,-22],[16,-24,28,-22],[-4,-23,-16,-25],[16,-23,28,-25]]) {
    ctx.beginPath(); ctx.moveTo(wx,wy); ctx.lineTo(ex,ey); ctx.stroke();
  }

  ctx.restore();

  // HP bar
  if (hp < maxHp) {
    const bw=36, bx=sx-bw/2, by=y-56;
    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(bx,by,bw,5);
    ctx.fillStyle = hp>maxHp*0.5?'#44ee44':'#ee4444';
    ctx.fillRect(bx,by,bw*hp/maxHp,5);
  }

  // Neutral cats show name when close to player
  if (type==='neutral' && distX({x},{x:P.x})<90) {
    ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(sx-28,y-68,56,16);
    ctx.fillStyle='#ffccff'; ctx.font='10px monospace'; ctx.textAlign='center';
    ctx.fillText('F = befriend',sx,y-57);
    ctx.textAlign='left';
  }
}

function lighten(hex, f) { return adjustColor(hex, f); }
function darken(hex, f)  { return adjustColor(hex, f); }
function adjustColor(hex, f) {
  let r=parseInt(hex.slice(1,3)||'88',16),
      g=parseInt(hex.slice(3,5)||'88',16),
      b=parseInt(hex.slice(5,7)||'88',16);
  r=Math.min(255,Math.round(r*f));
  g=Math.min(255,Math.round(g*f));
  b=Math.min(255,Math.round(b*f));
  return `rgb(${r},${g},${b})`;
}

function drawDrops() {
  for (const d of drops) {
    const sx=d.x-camX;
    if (sx<-30||sx>W+30) continue;
    // Glow
    const grd=ctx.createRadialGradient(sx,d.y,0,sx,d.y,16);
    grd.addColorStop(0,d.color+'cc'); grd.addColorStop(1,d.color+'00');
    ctx.fillStyle=grd; ctx.beginPath(); ctx.arc(sx,d.y,16,0,Math.PI*2); ctx.fill();
    // Item circle
    ctx.fillStyle=d.color; ctx.beginPath(); ctx.arc(sx,d.y-4,8,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.font='bold 9px monospace'; ctx.textAlign='center';
    ctx.fillText(d.name[0],sx,d.y-1);
    ctx.textAlign='left';
  }
}

function drawHUD() {
  const friends = npcs.filter(n=>n.type==='friend').length;
  const enemies = npcs.filter(n=>n.type==='enemy').length;

  // Panel bg
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(10,10,220,80);
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.lineWidth=1; ctx.strokeRect(10,10,220,80);

  ctx.fillStyle='#eee'; ctx.font='bold 11px monospace';
  ctx.fillText('HP', 20, 32);
  ctx.fillText('HUNGER', 20, 56);

  // HP bar
  ctx.fillStyle='#333'; ctx.fillRect(60,21,150,12);
  const hpCol=P.hp>50?'#44ee44':P.hp>25?'#eeaa44':'#ee4444';
  ctx.fillStyle=hpCol; ctx.fillRect(60,21,150*P.hp/P.maxHp,12);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText(`${Math.round(P.hp)}/100`,62,31);

  // Hunger bar
  ctx.fillStyle='#333'; ctx.fillRect(80,45,130,12);
  const hCol=P.hunger>50?'#eeee44':P.hunger>25?'#eeaa44':'#ee4444';
  ctx.fillStyle=hCol; ctx.fillRect(80,45,130*P.hunger/P.maxHunger,12);
  ctx.fillStyle='#fff'; ctx.font='9px monospace';
  ctx.fillText(`${Math.round(P.hunger)}%`,82,55);

  // Friends
  ctx.fillStyle='#ff88ff'; ctx.font='bold 12px monospace';
  ctx.fillText(`Friends: ${friends}`, 20, 78);

  // Score + best
  ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(W-170,10,160,55);
  ctx.strokeStyle='rgba(255,255,255,0.1)'; ctx.strokeRect(W-170,10,160,55);
  ctx.fillStyle='#ffe44e'; ctx.font='bold 13px monospace';
  ctx.fillText(`Score: ${score}`, W-160, 32);
  ctx.fillStyle='#aaa'; ctx.font='10px monospace';
  ctx.fillText(`Best: ${bestScore}`, W-160, 50);

  // Controls hint
  ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(W/2-170,H-30,340,22);
  ctx.fillStyle='#777'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText('A/D Move  W Jump  J Attack  S Search Trash  F Befriend', W/2, H-15);
  ctx.textAlign='left';

  // Float texts
  for (const f of floats) {
    const sx=f.x-camX, alpha=f.life/60;
    ctx.globalAlpha=alpha;
    ctx.fillStyle=f.color; ctx.font='bold 13px monospace'; ctx.textAlign='center';
    ctx.fillText(f.text, sx, f.y - (60-f.life)*0.6);
    ctx.textAlign='left';
  }
  ctx.globalAlpha=1;
}

function drawTitle() {
  drawBg();
  // Panel
  ctx.fillStyle='rgba(0,0,0,0.75)'; ctx.fillRect(W/2-250,100,500,320);
  ctx.strokeStyle='rgba(255,180,80,0.5)'; ctx.lineWidth=2; ctx.strokeRect(W/2-250,100,500,320);

  ctx.textAlign='center';
  ctx.fillStyle='#ff9933'; ctx.font='bold 54px monospace';
  ctx.fillText('STRAY CAT', W/2, 175);
  ctx.fillStyle='#ffe44e'; ctx.font='bold 54px monospace';
  ctx.fillText('CITY', W/2, 232);

  ctx.fillStyle='#aaa'; ctx.font='13px monospace';
  ctx.fillText('Survive the streets. Find food. Make friends. Win fights.', W/2, 268);

  ctx.fillStyle='#eee'; ctx.font='11px monospace';
  const lines=[
    'A / D  —  Run left / right',
    'W / Up / Space  —  Jump',
    'J / Z  —  Scratch attack',
    'S  —  Search trash / dumpster for food',
    'F  —  Befriend a cat (walk up close)',
  ];
  lines.forEach((l,i)=>ctx.fillText(l, W/2, 295+i*22));

  // Blink press space
  if (Math.floor(Date.now()/500)%2===0){
    ctx.fillStyle='#ffe44e'; ctx.font='bold 18px monospace';
    ctx.fillText('Press SPACE to start!', W/2, 410);
  }

  if (bestScore>0){
    ctx.fillStyle='#ff88ff'; ctx.font='11px monospace';
    ctx.fillText(`Best Score: ${bestScore}`, W/2, 400);
  }
  ctx.textAlign='left';

  // Back to Games
  const bh2 = mouse_y && mouse_x>=W/2-70&&mouse_x<=W/2+70&&mouse_y>=420&&mouse_y<=442;
  ctx.fillStyle=bh2?'rgba(255,255,255,0.12)':'rgba(255,255,255,0.05)';
  ctx.fillRect(W/2-70,420,140,22);
  ctx.strokeStyle=bh2?'#888':'#444'; ctx.lineWidth=1; ctx.strokeRect(W/2-70,420,140,22);
  ctx.fillStyle=bh2?'#ccc':'#666'; ctx.font='10px monospace'; ctx.textAlign='center';
  ctx.fillText('← Back to Games',W/2,435);
  ctx.textAlign='left';
}

function drawGameOver() {
  drawBg();
  ctx.fillStyle='rgba(0,0,0,0.8)'; ctx.fillRect(W/2-240,120,480,280);
  ctx.strokeStyle='rgba(255,80,80,0.5)'; ctx.lineWidth=2; ctx.strokeRect(W/2-240,120,480,280);
  ctx.textAlign='center';
  ctx.fillStyle='#ff4444'; ctx.font='bold 52px monospace';
  ctx.fillText('GAME OVER', W/2, 200);
  const reason=P.hp<=0?'You ran out of health!':'You were too hungry!';
  ctx.fillStyle='#aaa'; ctx.font='14px monospace';
  ctx.fillText(reason, W/2, 235);
  ctx.fillStyle='#ffe44e'; ctx.font='bold 20px monospace';
  ctx.fillText(`Score: ${score}`, W/2, 275);
  if (score>=bestScore){ ctx.fillStyle='#ff88ff'; ctx.fillText('NEW BEST!', W/2, 305); }
  else { ctx.fillStyle='#aaa'; ctx.font='14px monospace'; ctx.fillText(`Best: ${bestScore}`, W/2, 305); }
  if (Math.floor(Date.now()/500)%2===0){
    ctx.fillStyle='#fff'; ctx.font='bold 16px monospace';
    ctx.fillText('Press SPACE to play again', W/2, 360);
  }
  ctx.textAlign='left';
}

function draw() {
  ctx.clearRect(0,0,W,H);
  if (gState==='title')    { drawTitle(); return; }
  if (gState==='gameover') { drawGameOver(); return; }

  drawBg();
  drawPlatforms();
  drawDrops();

  // Draw NPCs
  for (const n of npcs) {
    if (n.dead) continue;
    drawCat(n.x, n.y, n.dir, n.color, n.hp, n.maxHp, n.type, n.scratchAnim, n.invincible);
  }

  // Draw player
  drawCat(P.x, P.y, P.dir, P.color, P.hp, P.maxHp, 'player', P.scratchAnim, P.invincible);

  // Search hint
  for (const p of platforms) {
    if (!['trash','dumpster'].includes(p.type)||p.searched) continue;
    const cx=p.x-camX+p.w/2;
    if (Math.abs((P.x-camX)-cx)<65 && P.y===GROUND) {
      ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(cx-30,p.y-32,60,16);
      ctx.fillStyle='#ffe44e'; ctx.font='10px monospace'; ctx.textAlign='center';
      ctx.fillText('S = Search',cx,p.y-20);
      ctx.textAlign='left';
    }
  }

  drawHUD();
}

// --- MAIN LOOP ---
function loop() {
  update();

  // Input state handling
  if (gState==='title' && jp('Space')) { initGame(); gState='playing'; }
  if (gState==='gameover' && jp('Space')) { initGame(); gState='playing'; }

  draw();

  // Save prev keys
  for (const k in keys) wasKeys[k]=keys[k];
  for (const k in wasKeys) if (!keys[k]) wasKeys[k]=false;

  requestAnimationFrame(loop);
}

loop();
</script>
